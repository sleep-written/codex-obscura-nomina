<app-app-bar back="/songs" />

<div class="editor__page">
  <p class="editor__legend">
    Cada ficha es una nota cantable.
    La ligadura <i class="editor__legend-tie" aria-hidden="true"></i> une dos trozos en una sola
    nota — tócala para separarlos. <b class="editor__legend-gap">~</b> marca dónde se pueden unir
    dos notas. La barra bajo cada verso muestra cuánto se puede estirar o encoger.
  </p>

  <div class="editor__stanzas">
    <app-song-metadata-card
      [title]="song().title"
      [metadata]="song().metadata"
      [dirty]="store.dirty()"
      (titleChanged)="onTitle($event)"
      (changed)="store.setMetadata($event)"
      (cleared)="onClear()"
      (saved)="onSave()"
      (exported)="onExport()"
    />

    @for (stanza of song().stanzas; track stanza.id) {
      <button
        mat-button
        class="editor__insert"
        [attr.aria-label]="'Insertar una estrofa antes de la ' + ($index + 1)"
        (click)="store.addStanzaBefore(stanza.id)">
        <mat-icon>add</mat-icon>
        Insertar estrofa aquí
      </button>

      <app-stanza-card
        [stanza]="stanza"
        [position]="$index + 1"
        (titleChanged)="store.setStanzaTitle(stanza.id, $event)"
        (textChanged)="store.setStanzaText(stanza.id, $event)"
        (targetChanged)="store.setStanzaTarget(stanza.id, $event)"
        (versesChanged)="store.markVersesChanged()"
        (removed)="store.removeStanza(stanza.id)"
      />
    }

    <button mat-fab extended class="editor__add" (click)="store.addStanza()">
      <mat-icon>add</mat-icon>
      Agregar estrofa
    </button>
  </div>
</div>
