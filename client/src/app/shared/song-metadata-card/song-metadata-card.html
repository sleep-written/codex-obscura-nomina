<mat-card class="meta" appearance="outlined">
  <header class="meta__head">
    <mat-icon class="meta__icon">album</mat-icon>
    <h2 class="meta__name">{{ title().trim() || 'Canción sin nombre' }}</h2>

    @if (dirty()) {
      <span class="meta__count meta__count--dirty">sin guardar</span>
    } @else {
      <span class="meta__count">
        @if (filled() === 0) {
          sin datos del disco
        } @else {
          {{ filled() }} de 5
        }
      </span>
    }

    <div class="meta__actions">
      <button mat-icon-button aria-label="Vaciar el editor" title="Vaciar el editor" (click)="cleared.emit()">
        <mat-icon>restart_alt</mat-icon>
      </button>
      <button mat-icon-button aria-label="Exportar .lyrics" title="Exportar como archivo .lyrics" (click)="exported.emit()">
        <mat-icon>download</mat-icon>
      </button>
      <button
        mat-icon-button
        aria-label="Guardar"
        [title]="
          titleMissing() ? 'Escribe un título para guardar'
          : dirty() ? 'Guardar en el navegador'
          : 'Sin cambios que guardar'
        "
        [disabled]="!dirty() || titleMissing()"
        (click)="saved.emit()">
        <mat-icon>save</mat-icon>
      </button>
    </div>
  </header>

  <mat-card-content class="meta__body">
    <mat-form-field appearance="outline" class="meta__field meta__field--full">
      <mat-label>Título de la canción</mat-label>
      <input
        matInput
        [value]="title()"
        (input)="titleChanged.emit($any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="meta__field meta__field--wide">
      <mat-label>Artista</mat-label>
      <input
        matInput
        [value]="metadata().artist"
        (input)="onText('artist', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="meta__field meta__field--wide">
      <mat-label>Artista del álbum</mat-label>
      <input
        matInput
        title="Solo si el álbum es de un artista distinto al de la canción (recopilatorios, colaboraciones)"
        [value]="metadata().albumArtist"
        (input)="onText('albumArtist', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="meta__field">
      <mat-label>Álbum</mat-label>
      <input
        matInput
        [value]="metadata().album"
        (input)="onText('album', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="meta__field">
      <mat-label>Año</mat-label>
      <input
        matInput
        type="number"
        min="1"
        inputmode="numeric"
        [value]="metadata().albumYear ?? ''"
        (input)="onNumber('albumYear', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="meta__field">
      <mat-label>N.º de pista</mat-label>
      <input
        matInput
        type="number"
        min="1"
        inputmode="numeric"
        [value]="metadata().trackNumber ?? ''"
        (input)="onNumber('trackNumber', $any($event.target).value)" />
    </mat-form-field>
  </mat-card-content>
</mat-card>
