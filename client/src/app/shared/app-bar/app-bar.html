      class="bar__back"
      aria-label="Volver"
      title="Volver"
      [routerLink]="route">

    </button>
  }

  <span class="bar__brand">Codex<b>Obscura</b>Nomina</span>

  <span class="bar__spacer"></span>

</mat-toolbar>
