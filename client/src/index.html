<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Client</title>
    <base href="/" />
    <!-- viewport-fit=cover habilita env(safe-area-inset-*); inocuo fuera de moviles. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Roboto y Material Icons se auto-hospedan via angular.json > styles
      (@fontsource/roboto y material-icons). No hay dependencia de red: sin
      esto los <mat-icon> renderizan su ligadura como texto en un empaquetado
      nativo o sin conexion.
    -->
  </head>
  <!--
    spellcheck se hereda: apagarlo aqui cubre todos los campos de la app (letra,
    titulos, artista, album) sin repetir el atributo por plantilla. La letra de
    una cancion y los nombres propios no estan en ningun diccionario, asi que el
    corrector del navegador solo subraya en rojo texto correcto.

    Va en el HTML y no en el shell nativo a proposito: asi vale igual en web,
    Android y Windows, y sobrevive a un cambio de empaquetador.
  -->
  <body spellcheck="false">
    <app-root></app-root>
  </body>
</html>
